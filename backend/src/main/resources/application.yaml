spring:
  application:
    name: studymate-backend
  datasource:
    url: ${STUDYMATE_DATABASE_URL}
    username: ${STUDYMATE_DATABASE_USERNAME}
    password: ${STUDYMATE_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 30
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    log-resolved-exception: false
    log-request-details: false
  servlet:
    multipart:
      enabled: false

server:
  address: ${STUDYMATE_SERVER_ADDRESS:127.0.0.1}
  port: ${STUDYMATE_SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
  health:
    diskspace:
      enabled: false
