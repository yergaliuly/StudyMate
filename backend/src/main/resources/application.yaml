spring:
  application:
    name: studymate-backend
  datasource:
    url: ${STUDYMATE_DATABASE_URL}
    username: ${STUDYMATE_DATABASE_USERNAME}
    password: ${STUDYMATE_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 30
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: studymate.spring_session
      cleanup-cron: '0 * * * * *'
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    log-resolved-exception: false
    log-request-details: false
  servlet:
    multipart:
      enabled: true
      resolve-lazily: true
      max-file-size: 26214400B
      max-request-size: 26279936B
      file-size-threshold: 0B

studymate:
  ai:
    provider: ${STUDYMATE_AI_PROVIDER:disabled}
  r2:
    enabled: ${STUDYMATE_R2_ENABLED:false}
    endpoint: ${STUDYMATE_R2_ENDPOINT:}
    bucket: ${STUDYMATE_R2_BUCKET:}
    access-key-id: ${STUDYMATE_R2_ACCESS_KEY_ID:}
    secret-access-key: ${STUDYMATE_R2_SECRET_ACCESS_KEY:}
  materials:
    maintenance-enabled: ${STUDYMATE_MATERIAL_MAINTENANCE_ENABLED:true}
  jobs:
    enabled: ${STUDYMATE_JOBS_ENABLED:true}
    poll-interval-ms: ${STUDYMATE_JOBS_POLL_INTERVAL_MS:1000}
    heartbeat-interval-ms: ${STUDYMATE_JOBS_HEARTBEAT_INTERVAL_MS:5000}
    lease-seconds: ${STUDYMATE_JOBS_LEASE_SECONDS:30}
    execution-timeout-seconds: ${STUDYMATE_JOBS_EXECUTION_TIMEOUT_SECONDS:120}
    max-attempts: ${STUDYMATE_JOBS_MAX_ATTEMPTS:3}
    retry-delay-seconds: ${STUDYMATE_JOBS_RETRY_DELAY_SECONDS:2}
    max-retry-delay-seconds: ${STUDYMATE_JOBS_MAX_RETRY_DELAY_SECONDS:60}
  registration:
    enabled: ${STUDYMATE_REGISTRATION_ENABLED:false}

server:
  tomcat:
    connection-timeout: 30s
    max-part-count: 3
    max-part-header-size: 2048B
    max-parameter-count: 5
    max-http-form-post-size: 65536B
  address: ${STUDYMATE_SERVER_ADDRESS:127.0.0.1}
  port: ${STUDYMATE_SERVER_PORT:8080}
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: STUDYMATE_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
  health:
    diskspace:
      enabled: false

logging:
  level:
    # Rollback failures can otherwise dump SQL/exception details. The outer session filter
    # records only the exception type and returns the same safe error envelope.
    org.springframework.transaction.support.TransactionTemplate: 'OFF'
    software.amazon.awssdk: 'OFF'
