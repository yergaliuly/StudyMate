spring:
  application:
    name: studymate-backend
  datasource:
    url: ${STUDYMATE_DATABASE_URL}
    username: ${STUDYMATE_DATABASE_USERNAME}
    password: ${STUDYMATE_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 30
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: studymate.spring_session
      cleanup-cron: '0 * * * * *'
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    log-resolved-exception: false
    log-request-details: false
  servlet:
    multipart:
      enabled: false

studymate:
  registration:
    enabled: ${STUDYMATE_REGISTRATION_ENABLED:false}

server:
  address: ${STUDYMATE_SERVER_ADDRESS:127.0.0.1}
  port: ${STUDYMATE_SERVER_PORT:8080}
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: STUDYMATE_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
  health:
    diskspace:
      enabled: false

logging:
  level:
    # Rollback failures can otherwise dump SQL/exception details. The outer session filter
    # records only the exception type and returns the same safe error envelope.
    org.springframework.transaction.support.TransactionTemplate: 'OFF'
