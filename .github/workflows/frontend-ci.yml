name: Frontend CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run API and session tests
        run: >-
          node --test
          tests/apiClient.test.js
          tests/authApi.test.js
          tests/subjectApi.test.js
          tests/sessionFlow.test.js
          tests/retryAfter.test.js
          tests/subjectDraft.test.js
          tests/jobApi.test.js
          tests/jobWatcher.test.js
          tests/materialTextReader.test.js
          tests/materialProcessingAction.test.js
          tests/storageApi.test.js
          tests/materialApi.test.js
          tests/materialDownloadAction.test.js
          tests/materialRenameAction.test.js
          tests/materialDeleteAction.test.js
          tests/summaryApi.test.js
          tests/summaryEditAction.test.js
          tests/materialSummaryController.test.js
          tests/quizApi.test.js
          tests/materialQuizController.test.js
          tests/attemptApi.test.js
          tests/quizAttemptController.test.js
          tests/attemptHistoryController.test.js
          tests/materialUploadDraft.test.js

      - name: Build frontend
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - name: Check CSRF initialization in Vite dev StrictMode
        run: npx playwright test --config playwright.dev.config.js

  deployment:
    name: Frontend container and HTTPS proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build production image
        run: docker build --tag studymate-frontend:ci .

      - name: Check static site and HTTPS API proxy
        run: node deploy/tests/proxy-smoke.mjs --docker studymate-frontend:ci
